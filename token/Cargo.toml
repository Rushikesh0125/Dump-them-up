[package]
name = "dtu_token"
version = "0.1.0"
edition = "2021"
description = "Standard NEP-141 test token for Dump Them Up ($BLACKDRAGON, $SHITZU, $NEKO, mUSD)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
