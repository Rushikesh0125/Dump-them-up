[package]
name = "dump_them_up"
version = "0.1.0"
edition = "2021"
description = "Dump Them Up: a memecoin cartel war on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.test]
opt-level = 2
